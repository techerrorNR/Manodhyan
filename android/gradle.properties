# Leave memory available for Flutter, Kotlin, and Windows on an 8 GB machine.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx512m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
android.enableJetifier=true

org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.daemon=false
